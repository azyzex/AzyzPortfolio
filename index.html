<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mohamed Aziz Guenni is a Full-Stack Web & Mobile Developer building practical web, mobile, AI-powered, backend, and connected systems."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="%SITE_URL%" />
    <title>Mohamed Aziz Guenni | Full-Stack Web & Mobile Developer</title>

    <!-- Link previews. %SITE_URL% is substituted at build time from
         package.json "homepage" (see vite.config.ts). Regenerate the card with
         `npm run generate:og` if the name, title, or photo changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mohamed Aziz Guenni" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="Mohamed Aziz Guenni | Full-Stack Web & Mobile Developer" />
    <meta
      property="og:description"
      content="I build practical web, mobile, and AI-powered applications with clean interfaces, secure backends, and real-time systems."
    />
    <meta property="og:image" content="%SITE_URL%assets/og/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mohamed Aziz Guenni, Full-Stack Web & Mobile Developer"
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohamed Aziz Guenni | Full-Stack Web & Mobile Developer" />
    <meta
      name="twitter:description"
      content="I build practical web, mobile, and AI-powered applications with clean interfaces, secure backends, and real-time systems."
    />
    <meta name="twitter:image" content="%SITE_URL%assets/og/og-card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
